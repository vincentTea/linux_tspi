name: Build Rockchip DTBs

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Source tag/branch to build from'
        required: true
        default: 'vincentTea-hibuffx'

env:
  ARCH: arm64
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-dtbs-pure:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag }}
          submodules: false
          fetch-depth: 1

      - name: Create Release (CST/UTC+8)
        id: create_release
        run: |
          # === 修改：使用 TZ=Asia/Shanghai 获取中国时间 ===
          # 获取当前北京时间
          current_date=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')
          
          TAG_NAME="DTB-Pure-$current_date"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          
          # 创建 Release
          gh release create "$TAG_NAME" \
            --title "DTB Pure Build $current_date (CST)" \
            --notes "Contains all .dtb and .dtbo files with original folder structure. Built at $(TZ=Asia/Shanghai date)" \
            -R ${{ github.repository }}

      - name: Install Toolchain & Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler make gcc bc
          
          # 下载 GCC 14.2 交叉编译链
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Generate Config
        run: |
          # 生成基础配置
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- tspi_defconfig

      - name: Compile All DTBs
        run: |
          echo ">>> Compiling DTBs and Overlays..."
          # make dtbs 会自动递归编译所有 dtb 和 overlay
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- dtbs -j$(nproc)

      - name: Package with Structure
        run: |
          echo ">>> Packaging..."
          
          # 进入 dtb 所在的目录
          cd arch/arm64/boot/dts/rockchip/
          
          # 1. 查找当前目录及子目录(overlay)下的所有 .dtb 和 .dtbo 文件
          # 2. 将列表输出到临时文件
          find . -type f \( -name "*.dtb" -o -name "*.dtbo" \) > ../../../../../filelist.txt
          
          # 3. 按照列表打包，保留目录结构
          tar -zcvf ../../../../../dtbs-with-overlay.tar.gz -T ../../../../../filelist.txt
          
          cd ../../../../../
          
          # 验证内容
          echo ">>> Checking content (first 10 files):"
          tar -tf dtbs-with-overlay.tar.gz | head -n 10

      - name: Upload Release
        run: |
          gh release upload ${{ env.RELEASE_TAG }} dtbs-with-overlay.tar.gz --clobber -R ${{ github.repository }}
