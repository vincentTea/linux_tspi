name: Build Only DTBs (Global)

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Source tag/branch to build from'
        required: true
        default: 'vincentTea-hibuffx'

env:
  ARCH: arm64
  # 您的标准文件名
  DTB_STANDARD: rk3566-lckfb-tspi
  # 您的自定义后缀
  CUSTOM_SUFFIX: hibuffx
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-dtbs-only:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag }}
          submodules: false # 编译DTB通常不需要子模块，加快速度
          fetch-depth: 1    # 浅克隆，加快速度

      - name: Create Release
        id: create_release
        run: |
          TAG_NAME="DTB-Only-$(date +'%Y%m%d-%H%M')"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          
          gh release create "$TAG_NAME" \
            --title "DTB Collection $TAG_NAME" \
            --notes "Contains all compiled DTBs from arch/arm64/boot/dts/rockchip/." \
            -R ${{ github.repository }}

      - name: Install Toolchain & Deps
        run: |
          # 安装编译 DTB 必须的宿主工具
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler bc flex bison libssl-dev make gcc
          
          # 下载并配置交叉编译链 (GCC 14.2)
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Configure & Overwrite DTS
        run: |
          # 1. 执行您的覆盖策略（将 hibuffx 伪装成 standard）
          #    这样全局编译时，rk3566-lckfb-tspi.dtb 实际上就是您的 hibuffx 配置
          echo ">>> Overwriting Standard DTS with Hibuffx source..."
          cp arch/arm64/boot/dts/rockchip/rk3566-lckfb-tspi-${{ env.CUSTOM_SUFFIX }}.dts \
             arch/arm64/boot/dts/rockchip/${{ env.DTB_STANDARD }}.dts
          
          # 2. 生成基础配置 (编译 DTB 前必须先生成 .config)
          #    这里使用 tspi_defconfig，确保宏定义正确
          echo ">>> Generating config..."
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- tspi_defconfig

      - name: Make All DTBs
        run: |
          echo ">>> Starting Global DTB Build..."
          # 使用标准方式编译所有 DTB
          # -j$(nproc): 多核并行
          # 如果遇到错误，Action 会在此处停止
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- dtbs -j$(nproc)

      - name: Package & Upload
        run: |
          echo ">>> Packaging..."
          # 创建打包目录
          mkdir -p output_dtbs
          
          # 收集所有编译成功的 Rockchip DTB
          cp arch/arm64/boot/dts/rockchip/*.dtb output_dtbs/
          
          # 打包
          cd output_dtbs
          tar -zcvf ../all-rockchip-dtbs.tar.gz *.dtb
          cd ..
          
          # 上传 Release
          echo ">>> Uploading..."
          gh release upload ${{ env.RELEASE_TAG }} all-rockchip-dtbs.tar.gz --clobber -R ${{ github.repository }}
