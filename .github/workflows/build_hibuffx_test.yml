name: Debug Build2 (Fast Resume Mode)

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Git Tag/Branch'
        required: true
        default: 'vincentTea-hibuffx'
      
      # === [复用产物] 填入链接，享受 3分钟 极速构建 ===
      reuse_kernel_img:
        description: '[加速] Image URL (复用内核)'
        required: false
      reuse_build_deps:
        description: '[加速] build-deps.tar.gz URL (复用配置)'
        required: false
      reuse_modules_tar:
        description: '[加速] modules.tar.gz URL (复用模块)'
        required: false

env:
  ARCH: arm64
  src_path: /home/runner/work/linux/linux
  modules_path: /home/runner/work/linux/linux/modules/lib/modules
  DTB_NAME: rk3566-lckfb-tspi
  CUSTOM_SUFFIX: hibuffx
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-final:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag }}
          submodules: true
          fetch-depth: 0

      - name: Init Release
        run: |
          TAG_NAME="build-$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          
          gh release create "$TAG_NAME" \
            --title "Build: $TAG_NAME" \
            --notes "Debug Build Artifacts" \
            --draft=false \
            --prerelease=true

      - name: Setup Env & Tools
        run: |
          chmod +x scripts/mkimg scripts/resource_tool scripts/mkbootimg scripts/* || true
          
          sudo apt-get update
          sudo apt-get install -y tree device-tree-compiler u-boot-tools libssl-dev bc flex bison libncurses-dev initramfs-tools busybox-static
          
          # LZ4
          LZ4_URL=$(curl -s https://api.github.com/repos/lz4/lz4/releases/latest | grep 'tarball_url' | cut -d\" -f4)
          wget $LZ4_URL -O lz4.tar.gz && tar -xzf lz4.tar.gz && cd lz4-lz4-* && make -j$(nproc) && sudo make install && sudo ldconfig
          
          # Toolchain
          wget https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Configure Kernel
        run: |
          mkdir -p ${{ env.src_path }}/modules
          cp arch/arm64/boot/dts/rockchip/rk3566-lckfb-tspi-${{ env.CUSTOM_SUFFIX }}.dts arch/arm64/boot/dts/rockchip/${{ env.DTB_NAME }}.dts
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- tspi_defconfig

      # === 2. Kernel Image (复用逻辑) ===
      - name: Process Kernel Image
        run: |
          IMG_URL="${{ github.event.inputs.reuse_kernel_img }}"
          DEPS_URL="${{ github.event.inputs.reuse_build_deps }}"
          
          if [[ -n "$IMG_URL" ]] && [[ -n "$DEPS_URL" ]]; then
            echo ">>> [加速] 下载 Image 和 依赖..."
            wget -O arch/arm64/boot/Image "$IMG_URL"
            wget -O build-deps.tar.gz "$DEPS_URL"
            tar -xzf build-deps.tar.gz
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_prepare
            
          else
            echo ">>> [全量] 编译 Image..."
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- Image -j$(nproc)
            
            if [ -f "arch/arm64/boot/Image" ]; then
              gh release upload ${{ env.RELEASE_TAG }} arch/arm64/boot/Image --clobber
            fi
            
            # 处理符号表
            if [ ! -f "Module.symvers" ] && [ -f "vmlinux.symvers" ]; then
                cp vmlinux.symvers Module.symvers
            fi
            # 容错打包
            tar -zcf build-deps.tar.gz .config Module.symvers vmlinux.symvers System.map 2>/dev/null || tar -zcf build-deps.tar.gz .config System.map
            gh release upload ${{ env.RELEASE_TAG }} build-deps.tar.gz --clobber
          fi

      # === 3. Modules (复用逻辑) ===
      - name: Process Modules
        run: |
          MOD_URL="${{ github.event.inputs.reuse_modules_tar }}"
          mkdir -p ${{ env.modules_path }}
          
          if [[ -n "$MOD_URL" ]]; then
            echo ">>> [极速] 下载 Modules..."
            wget -O modules-cache.tar.gz "$MOD_URL"
            tar -xzf modules-cache.tar.gz -C ${{ env.modules_path }}
          else
            echo ">>> [编译] Modules..."
            if [ ! -f "Module.symvers" ]; then
               make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_prepare
            fi
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules -j$(nproc)
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_install INSTALL_MOD_PATH=${{ env.src_path }}/modules
          fi
          
          # 获取真实版本号 (无cd操作)
          REAL_VER=$(ls ${{ env.modules_path }} | head -n 1)
          echo "REAL_VER=$REAL_VER" >> $GITHUB_ENV
          echo ">>> 真实内核版本: $REAL_VER"
          
          if [[ -z "$MOD_URL" ]]; then
            # 使用 -C 指定源目录，但打包到当前目录
            tar -zcf modules-$REAL_VER.tar.gz -C ${{ env.modules_path }} $REAL_VER
            gh release upload ${{ env.RELEASE_TAG }} modules-$REAL_VER.tar.gz --clobber
          fi

      # === 4. Boot & DTB ===
      - name: Build Final Artifacts
        run: |
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- rockchip/${{ env.DTB_NAME }}.dtb
          ./scripts/resource_tool arch/arm64/boot/dts/rockchip/${{ env.DTB_NAME }}.dtb
          
          gh release upload ${{ env.RELEASE_TAG }} resource.img --clobber
          
          echo ">>> 制作 boot.img..."
          ./scripts/mkbootimg --kernel arch/arm64/boot/Image --second resource.img -o boot.img
          
          CUSTOM_NAME="rk3566-lckfb-tspi-${{ env.CUSTOM_SUFFIX }}-boot-${{ env.REAL_VER }}.img"
          
          if [ -f "boot.img" ]; then
             mv boot.img $CUSTOM_NAME
             echo ">>> [存档] 上传 boot.img..."
             gh release upload ${{ env.RELEASE_TAG }} $CUSTOM_NAME --clobber
          else
             echo "FATAL: boot.img 生成失败"
             tree -L 2
             exit 1
          fi

      # === 5. Armbian 打包 (修复了路径问题) ===
      - name: Package Armbian
        run: |
           KVER=${{ env.REAL_VER }}
           mkdir -p ${{ env.src_path }}/boot_files_final
           
           # 复制所有文件到临时目录
           cp arch/arm64/boot/Image ${{ env.src_path }}/boot_files_final/vmlinuz-$KVER
           cp System.map ${{ env.src_path }}/boot_files_final/System.map-$KVER || true
           cp .config ${{ env.src_path }}/boot_files_final/config-$KVER || true
           
           # 检查是否存在复用的 modules 包，有则复制
           if [ -f "modules-$KVER.tar.gz" ]; then
              cp modules-$KVER.tar.gz ${{ env.src_path }}/boot_files_final/
           elif [ -f "modules-cache.tar.gz" ]; then
              # 如果是下载的复用包，可能叫这个名字
              cp modules-cache.tar.gz ${{ env.src_path }}/boot_files_final/modules-$KVER.tar.gz
           fi
           
           echo ">>> 打包 Armbian 文件..."
           # [核心修改] 使用 tar -C 参数，不切换 Shell 目录
           tar -zcf armbian_boot-$KVER.tar.gz -C ${{ env.src_path }}/boot_files_final .
           
           echo ">>> [存档] 上传 Armbian 包..."
           # 此时我们在 Git 根目录，gh 一定能成功
           gh release upload ${{ env.RELEASE_TAG }} armbian_boot-$KVER.tar.gz --clobber
