name: Build Hibuffx AP6212 Image (pro2)

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Source tag to build from'
        required: true
        default: 'vincentTea-hibuffx'
      
      reuse_kernel_img:
        description: '[加速] Image URL (复用内核)'
        required: false
      reuse_build_deps:
        description: '[加速] build-deps.tar.gz URL (复用配置)'
        required: false
      reuse_modules_tar:
        description: '[加速] modules.tar.gz URL (复用模块)'
        required: false

env:
  ARCH: arm64
  DTB_STANDARD: rk3566-lckfb-tspi
  CUSTOM_SUFFIX: hibuffx
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize Release
        id: create_release
        run: |
          TAG_NAME="Hibuffx-$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')"
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          
          gh release create "$TAG_NAME" \
            --title "Hibuffx Build $TAG_NAME (CST)" \
            --notes "DTS: Full Rockchip Set. Firmware: TSPI AP6212. Build Time: $(TZ=Asia/Shanghai date)" \
            --draft=false \
            --prerelease=false \
            -R ${{ github.repository }}

      - name: Install Tools & Deps
        run: |
          chmod +x scripts/mkimg scripts/resource_tool scripts/mkbootimg scripts/* || true
          
          LZ4_LATEST=$(curl -s https://api.github.com/repos/lz4/lz4/releases/latest | grep 'tarball_url' | cut -d\" -f4)
          wget $LZ4_LATEST -O lz4.tar.gz && tar -xzf lz4.tar.gz && cd lz4-lz4-* && make -j$(nproc) && sudo make install && sudo ldconfig
          
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler u-boot-tools libssl-dev bc flex bison libncurses-dev initramfs-tools busybox-static tree
          sudo -E apt-get -y install $(curl -fsSL https://tinyurl.com/ubuntu2204-build-armbian)
          
          wget https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Setup Dynamic Paths
        run: |
          WORK_DIR="${{ github.workspace }}"
          echo "src_path=$WORK_DIR" >> $GITHUB_ENV
          echo "modules_install_path=$WORK_DIR/modules_install" >> $GITHUB_ENV
          echo "armbian_path=$WORK_DIR/armbian_boot" >> $GITHUB_ENV
          echo "dtb_path=$WORK_DIR/dtbs" >> $GITHUB_ENV
          echo "armbian_file_path=$WORK_DIR/armbian_boot_files" >> $GITHUB_ENV
          mkdir -p "$WORK_DIR/modules_install" "$WORK_DIR/armbian_boot" "$WORK_DIR/armbian_boot_files" "$WORK_DIR/dtbs"

      # === 核心策略：Git Commit 法去除 Dirty ===
      - name: Configure Kernel & Clean Git State
        run: |
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- tspi_defconfig
          
          echo ">>> [策略] 执行 Git Commit 以清除 Dirty 状态..."
          git config --global user.email "support@hibuffx.com"
          git config --global user.name "HiBuffxEngineer"
          git add .
          git commit -m "Auto-commit to clean dirty state" || echo "No changes to commit"

      # === Kernel Image & Build Deps (核心修改点) ===
      - name: Process Kernel Image
        run: |
          IMG_URL="${{ github.event.inputs.reuse_kernel_img }}"
          DEPS_URL="${{ github.event.inputs.reuse_build_deps }}"
          
          if [[ -n "$IMG_URL" ]] && [[ -n "$DEPS_URL" ]]; then
            echo ">>> [加速] 下载 Image 和 依赖..."
            wget -O arch/arm64/boot/Image "$IMG_URL"
            wget -O build-deps.tar.gz "$DEPS_URL"
            
            echo ">>> [恢复] 解压构建环境..."
            # 使用 -p 保留权限（关键：脚本的可执行位），-x 解压
            tar -xpzf build-deps.tar.gz
            
            # 关键：更新 .config 时间戳，防止 make 误判需要重新配置
            touch .config
            
            echo ">>> [检查] 验证环境完整性..."
            # 因为保留了 scripts/ 下的二进制文件，这一步应该极快
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_prepare
          else
            echo ">>> [全量] 编译 Image..."
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- Image -j$(nproc)
            
            # 确保符号表存在
            if [ ! -f "Module.symvers" ]; then
                make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_prepare
            fi

            if [ -f "arch/arm64/boot/Image" ]; then
                gh release upload ${{ env.RELEASE_TAG }} arch/arm64/boot/Image --clobber -R ${{ github.repository }}
            fi
            
            # --- [优化打包策略] ---
            echo ">>> [清理] 准备打包依赖环境..."
            
            # 1. 删除 .git 目录（巨大且复用时无用）
            rm -rf .git
            
            # 2. 删除 drivers, fs, net 等源码目录下的 .o 和 .a 文件 (节省空间)
            # 关键：排除 scripts, tools, include, arch 目录，保留构建工具和架构相关对象
            echo "Removing unnecessary object files..."
            find . -type f \( -name "*.o" -o -name "*.a" \) \
                -not -path "./scripts/*" \
                -not -path "./tools/*" \
                -not -path "./arch/arm64/include/*" \
                -not -path "./include/*" \
                -delete
            
            # 3. 删除未被使用的临时文件
            find . -name "*.cmd" -delete
            find . -name "*.tmp" -delete
            
            echo ">>> [打包] 构建完整依赖包 (包含 vmlinux 和 scripts)..."
            # 4. 打包当前目录所有内容 (保留了目录结构、vmlinux、scripts二进制、include等)
            # 排除自身防止递归
            tar -zcf build-deps.tar.gz --exclude=build-deps.tar.gz . 

            gh release upload ${{ env.RELEASE_TAG }} build-deps.tar.gz --clobber -R ${{ github.repository }}
          fi

      # === Modules ===
      - name: Process Modules
        run: |
          MOD_URL="${{ github.event.inputs.reuse_modules_tar }}"
          
          if [[ -n "$MOD_URL" ]]; then
            echo ">>> [极速] 下载 Modules..."
            wget -O modules.tar.gz "$MOD_URL"
            tar -xzf modules.tar.gz -C ${{ env.modules_install_path }}
          else
            echo ">>> [编译] Modules..."
            # 这里即使在 reuse 模式下，由于上一步恢复了完整环境，modules_prepare 也是安全的
            if [ ! -f "Module.symvers" ]; then
               make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_prepare
            fi
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules -j$(nproc)
            make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_install INSTALL_MOD_PATH=${{ env.modules_install_path }}
          fi
          
          if [ -d "${{ env.modules_install_path }}/lib/modules" ]; then
              CD_PATH="${{ env.modules_install_path }}/lib/modules"
          else
              CD_PATH="${{ env.modules_install_path }}"
          fi
          
          REAL_VER=$(ls $CD_PATH | head -n 1)
          echo "REAL_VER=$REAL_VER" >> $GITHUB_ENV
          echo "kernel_main_version=$REAL_VER" >> $GITHUB_ENV
          
          if [[ -z "$MOD_URL" ]]; then
            tar -zcf modules-$REAL_VER.tar.gz -C $CD_PATH $REAL_VER
            gh release upload ${{ env.RELEASE_TAG }} modules-$REAL_VER.tar.gz --clobber -R ${{ github.repository }}
          fi

      # === Build All DTBs & Boot Image ===
      - name: Build All DTBs & Boot Image
        run: |
          echo ">>> [编译] 编译所有 DTBs..."
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- dtbs -j$(nproc)
          
          echo ">>> [打包] 独立 DTB 包 (dtbs-with-overlay.tar.gz)..."
          cd arch/arm64/boot/dts/rockchip/
          find . -type f \( -name "*.dtb" -o -name "*.dtbo" \) > ../../../../../dtb-filelist.txt
          tar -zcvf ../../../../../dtbs-with-overlay.tar.gz -T ../../../../../dtb-filelist.txt
          
          cp rk3566-lckfb-tspi-${{ env.CUSTOM_SUFFIX }}.dtb ../../../../../target_dtb.dtb
          cd ../../../../../
          
          gh release upload ${{ env.RELEASE_TAG }} dtbs-with-overlay.tar.gz --clobber -R ${{ github.repository }}
          
          echo ">>> [制作] 制作 boot.img..."
          ./scripts/resource_tool target_dtb.dtb
          ./scripts/mkbootimg --kernel arch/arm64/boot/Image --second resource.img -o boot.img
          
          BOOT_NAME="rk3566-lckfb-tspi-${{ env.CUSTOM_SUFFIX }}-boot-${{ env.REAL_VER }}.img"
          mv boot.img $BOOT_NAME
          gh release upload ${{ env.RELEASE_TAG }} $BOOT_NAME --clobber -R ${{ github.repository }}
          echo "BOOT_IMG_NAME=$BOOT_NAME" >> $GITHUB_ENV

      # === Package Firmware ===
      - name: Package Firmware (TSPI Specific)
        run: |
          cd ${{ env.src_path }}
          mkdir -p temp_fw_pack
          
          if [ -d "tspi_wifi_firmware" ]; then
             cp -r tspi_wifi_firmware/* temp_fw_pack/
          elif [ -d "firmware" ]; then
             cp -r firmware/* temp_fw_pack/
          else
             echo "Missing firmware" > temp_fw_pack/missing.txt
          fi
          
          cd temp_fw_pack
          if [ -f "brcmfmac43438a1-sdio.txt" ] && [ ! -f "nvram.txt" ]; then
              cp brcmfmac43438a1-sdio.txt nvram.txt
          fi
          
          cd ..
          tar -zcf ap6212_wifi_firmware.tar.gz -C temp_fw_pack .
          
          # Headers (Clean headers for end-users, distinct from build-deps)
          KVER=${{ env.REAL_VER }}
          HEADER_DIR="linux-headers-$KVER"
          mkdir -p $HEADER_DIR/arch/arm64
          cp -a Module.symvers Makefile scripts include .config $HEADER_DIR/ || true
          cp -a arch/arm64/include arch/arm64/kvm arch/arm64/Makefile $HEADER_DIR/arch/arm64/ || true
          tar -zcf linux-headers-$KVER.tar.gz $HEADER_DIR

      # === Process Armbian DTB ===
      - name: Process Armbian DTB
        run: |
          # 1. 创建 Armbian 期望的目录结构： dtb/rockchip
          mkdir -p ${{ env.dtb_path }}/dtb/rockchip
          
          # 2. 进入编译好的 DTB 目录
          cd arch/arm64/boot/dts/rockchip
          
          echo ">>> [复制] 将所有编译好的 .dtb 和 .dtbo 复制到打包目录..."
          find . -type f \( -name "*.dtb" -o -name "*.dtbo" \) -exec cp --parents {} ${{ env.dtb_path }}/dtb/rockchip/ \;
          
          # 3. 打包
          cd ${{ env.dtb_path }}
          tar -zcf dtb-rockchip-${{ env.REAL_VER }}.tar.gz dtb
          mv dtb-rockchip-${{ env.REAL_VER }}.tar.gz ${{ env.armbian_path }}/

      # === Initrd (Chroot) ===
      - name: Build Initrd (Chroot)
        run: |
          KVER=${{ env.REAL_VER }}
          sudo mkdir -p /mnt/chroot/lib/modules /mnt/chroot/usr/src /mnt/chroot/boot
          
          if [ -d "${{ env.modules_install_path }}/lib/modules/$KVER" ]; then
             sudo cp -a ${{ env.modules_install_path }}/lib/modules/$KVER /mnt/chroot/lib/modules/
          else
             sudo cp -a ${{ env.modules_install_path }}/$KVER /mnt/chroot/lib/modules/
          fi
          
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static
          sudo debootstrap --arch=arm64 --variant=minbase jammy /mnt/chroot http://ports.ubuntu.com/
          
          sudo cp /usr/bin/qemu-aarch64-static /mnt/chroot/usr/bin/
          sudo mount -t proc proc /mnt/chroot/proc
          sudo mount -t sysfs sys /mnt/chroot/sys
          sudo mount -o bind /dev /mnt/chroot/dev
          
          sudo chroot /mnt/chroot /bin/bash <<EOF
          apt-get update
          apt-get install -y initramfs-tools u-boot-tools busybox-static kmod linux-base
          sed -i "s|^update_initramfs=.*|update_initramfs=no|g" /etc/initramfs-tools/update-initramfs.conf
          sed -i "s|^COMPRESS=.*|COMPRESS=gzip|g" /etc/initramfs-tools/initramfs.conf
          update-initramfs -c -k $KVER
          mkimage -A arm64 -O linux -T ramdisk -C gzip -a 0 -e 0 -n uInitrd -d /boot/initrd.img-$KVER /boot/uInitrd-$KVER
          EOF
          
          sudo cp /mnt/chroot/boot/initrd.img-$KVER ${{ env.armbian_file_path }}/
          sudo cp /mnt/chroot/boot/uInitrd-$KVER ${{ env.armbian_file_path }}/
          
          sudo umount /mnt/chroot/dev /mnt/chroot/proc /mnt/chroot/sys
          sudo rm -rf /mnt/chroot

      # === Final Packaging (Armbian) ===
      - name: Final Packaging (Armbian)
        run: |
          KVER=${{ env.REAL_VER }}
          cp arch/arm64/boot/Image ${{ env.armbian_file_path }}/vmlinuz-$KVER
          cp System.map ${{ env.armbian_file_path }}/System.map-$KVER
          cp .config ${{ env.armbian_file_path }}/config-$KVER
          
          cd ${{ env.armbian_file_path }}
          sudo chown -R runner:runner .
          tar -zcf boot-$KVER.tar.gz *
          mv boot-$KVER.tar.gz ${{ env.armbian_path }}/
          
          cd ${{ env.armbian_path }}
          mv ${{ env.src_path }}/ap6212_wifi_firmware.tar.gz .
          mv ${{ env.src_path }}/linux-headers-$KVER.tar.gz headers-$KVER.tar.gz
          
          if [ -f "modules-$KVER.tar.gz" ]; then
             echo "Using existing modules tar"
          else
             if [ -d "${{ env.modules_install_path }}/lib/modules/$KVER" ]; then
                 tar -zcf modules-$KVER.tar.gz -C ${{ env.modules_install_path }}/lib/modules $KVER
             else
                 tar -zcf modules-$KVER.tar.gz -C ${{ env.modules_install_path }} $KVER
             fi
          fi
          
          tar -zcf armbian_boot-$KVER.tar.gz *
          gh release upload ${{ env.RELEASE_TAG }} armbian_boot-$KVER.tar.gz --clobber -R ${{ github.repository }}

      # === Final Packaging (Flashable) ===
      - name: Final Packaging (Flashable)
        run: |
          KVER=${{ env.REAL_VER }}
          mkdir -p final_pack
          cd final_pack
          
          mv ${{ env.src_path }}/${{ env.BOOT_IMG_NAME }} .
          cp ${{ env.armbian_path }}/modules-$KVER.tar.gz .
          cp ${{ env.armbian_path }}/headers-$KVER.tar.gz .
          cp ${{ env.armbian_path }}/ap6212_wifi_firmware.tar.gz .
          
          tar -zcvf rk3566-tspi-${{ env.CUSTOM_SUFFIX }}-$KVER.tar.gz *
          gh release upload ${{ env.RELEASE_TAG }} rk3566-tspi-${{ env.CUSTOM_SUFFIX }}-$KVER.tar.gz --clobber -R ${{ github.repository }}
