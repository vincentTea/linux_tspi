name: Manual Build (Cached Toolchain & Session)

on:
  workflow_dispatch:
    inputs:
      # 1. 会话密钥：决定是“复用旧缓存”还是“开新坑”
      cache_session_key:
        description: '会话 Key (用于识别缓存，如 debug01)'
        required: true
        default: 'dev-session-01'
        type: string
      
      # 2. 编译选项：按需勾选
      do_build_kernel:
        description: '编译 Kernel Image'
        required: false
        default: true
        type: boolean
      do_build_modules:
        description: '编译 Modules (.ko)'
        required: false
        default: true
        type: boolean
      do_build_dtbs:
        description: '编译 DTBs'
        required: false
        default: true
        type: boolean

      # 3. Git源
      target_tag:
        description: 'Git Tag/Branch'
        required: true
        default: 'vincentTea-hibuffx'

env:
  ARCH: arm64
  # 设置中国时区，用于 Release 标题
  TZ: Asia/Shanghai
  # 工具链版本定义，方便后续升级修改
  TOOLCHAIN_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
  TOOLCHAIN_DIR: "arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # === 1. 拉取代码 ===
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_tag }}
          submodules: true
          fetch-depth: 0

      # === 2. 恢复编译缓存 (Session Cache) ===
      - name: Restore CCache (Compile Cache)
        uses: actions/cache/restore@v4
        id: restore-ccache
        with:
          path: ~/.cache/ccache
          # Key 包含 run_id 确保生成新槽位，restore-keys 确保能找到旧缓存
          key: ccache-${{ inputs.cache_session_key }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.cache_session_key }}-

      # === 3. 准备环境 & 缓存工具链 (关键优化) ===
      - name: Setup System Deps
        run: |
          # 快速安装系统小工具 (通常 <30秒)
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache pigz device-tree-compiler u-boot-tools libssl-dev bc flex bison libncurses-dev python3-pyelftools
          
          # 创建 ccache 目录
          mkdir -p ~/.cache/ccache
          # 设置 ccache 大小 (5G 足够内核使用)
          export PATH="/usr/lib/ccache:$PATH"
          ccache --max-size=5G

      # [方案A核心]：尝试恢复工具链缓存
      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          # 只要 URL 不变，缓存就永久有效
          key: toolchain-${{ env.TOOLCHAIN_URL }}

      # [方案A核心]：如果没命中缓存，才下载 (省去几百MB下载解压时间)
      - name: Download Toolchain (If missed)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo ">>> Toolchain cache miss. Downloading..."
          wget -q ${{ env.TOOLCHAIN_URL }} -O toolchain.tar.xz
          echo ">>> Extracting..."
          tar -xf toolchain.tar.xz
          rm toolchain.tar.xz

      # 配置 PATH，让系统找到 gcc
      - name: Setup Compiler Path
        run: |
          TC_BIN="$(pwd)/${{ env.TOOLCHAIN_DIR }}/bin"
          echo "$TC_BIN" >> $GITHUB_PATH
          echo "Toolchain path added: $TC_BIN"

      # === 4. 配置内核 ===
      - name: Configure Kernel
        run: |
          # 注入 ccache 到 PATH 头部
          export PATH="/usr/lib/ccache:$PATH"
          
          # 生成配置
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- tspi_defconfig
          
          # 准备 modules 环境 (即使不编 Image 也要做，防止 modpost 报错)
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_prepare

      # === 5. 按需编译 ===
      
      # [Kernel Image]
      - name: Build Kernel Image
        if: ${{ inputs.do_build_kernel == true }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          echo ">>> Building Image (Parallel)..."
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- Image -j$(nproc)

      # [Modules]
      - name: Build Modules
        if: ${{ inputs.do_build_modules == true }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          echo ">>> Building Modules..."
          # ccache 会自动跳过已编译且未修改的 .o 文件
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules -j$(nproc)

      # [DTBs]
      - name: Build DTBs
        if: ${{ inputs.do_build_dtbs == true }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          echo ">>> Building DTBs..."
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- dtbs -j$(nproc)

      # === 6. 打包产物 ===
      - name: Package Artifacts
        id: package
        run: |
          mkdir output_dist
          
          # 1. 打包 Image
          if [ -f "arch/arm64/boot/Image" ]; then
             cp arch/arm64/boot/Image output_dist/
             echo "Packaged: Image"
          fi
          
          # 2. 打包 DTBs
          # 检查是否有 dtb 文件生成
          if ls arch/arm64/boot/dts/rockchip/*.dtb 1> /dev/null 2>&1; then
             # 使用 pigz 加速压缩
             tar --use-compress-program=pigz -cf output_dist/dtbs.tar.gz arch/arm64/boot/dts/rockchip/*.dtb
             echo "Packaged: dtbs.tar.gz"
          fi
          
          # 3. 打包 Modules
          if [ "${{ inputs.do_build_modules }}" == "true" ]; then
             mkdir -p temp_mod_install
             # 安装 modules 到临时目录
             make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_install INSTALL_MOD_PATH=temp_mod_install
             
             # 提取版本号 (如 6.1.75-hibuffx)
             KVER=$(ls temp_mod_install/lib/modules | head -n1)
             
             if [ -n "$KVER" ]; then
                tar --use-compress-program=pigz -cf output_dist/modules-$KVER.tar.gz -C temp_mod_install/lib/modules $KVER
                echo "Packaged: modules-$KVER.tar.gz"
             fi
          fi
          
          echo "dist_path=$(pwd)/output_dist" >> $GITHUB_ENV

      # === 7. 发布 Release ===
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          # 标题格式：[Key] @ 2025-12-12 14:00:00
          name: "[${{ inputs.cache_session_key }}] @ $(date +'%Y-%m-%d %H:%M:%S')"
          # Tag 必须唯一，加上时间戳
          tag_name: "build-${{ inputs.cache_session_key }}-$(date +'%s')"
          files: ${{ env.dist_path }}/*
          body: |
            ### Build Information
            - **Session Key**: `${{ inputs.cache_session_key }}`
            - **Build Time**: $(date)
            - **Components**:
              - Kernel: ${{ inputs.do_build_kernel }}
              - Modules: ${{ inputs.do_build_modules }}
              - DTBs: ${{ inputs.do_build_dtbs }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === 8. [最重要] 强制保存编译缓存 ===
      # 无论上面是否编译失败 (if: always)，都保存当前的 .o 文件
      - name: Save CCache (Always)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          # Key 对应 Restore 步骤，下次 Restore 就能找到它
          key: ccache-${{ inputs.cache_session_key }}-${{ github.run_id }}
